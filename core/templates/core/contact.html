{% extends "base.html" %}
{% block title %}Contact - Blessed{% endblock %}
{% block body %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h1 class="mb-4">Contact me</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100" type="submit">Send message</button>
    </form>
    <p class="text-muted small mt-3">Messages land in the admin panel &mdash; I reply within 24h.</p>
  </div>
</div>
{% endblock %}
